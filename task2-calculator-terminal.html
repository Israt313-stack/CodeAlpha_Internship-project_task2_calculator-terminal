<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNIT-7 // Calc Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050807;
    --panel:#0b1210;
    --green:#3dff8a;
    --green-dim:#1c7a49;
    --amber:#ffb32e;
    --line:#173325;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1000px 600px at 50% 20%, rgba(61,255,138,0.06), transparent 60%),
      var(--bg);
    font-family:'JetBrains Mono',monospace;
    padding:24px;
  }
  .machine{
    width:360px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
    box-shadow: 0 0 0 1px #000, 0 20px 60px rgba(0,0,0,.6), 0 0 40px rgba(61,255,138,.05);
  }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    color:var(--green-dim); font-size:11px; letter-spacing:.1em; margin-bottom:12px;
  }
  .led{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); display:inline-block; margin-right:6px;}

  .screen{
    background:#010603;
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px 16px 14px;
    margin-bottom:18px;
    text-align:right;
    position:relative;
    overflow:hidden;
    min-height:100px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .screen::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(61,255,138,0.035) 0px, rgba(61,255,138,0.035) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .prev{ font-family:'VT323',monospace; color:var(--green-dim); font-size:18px; min-height:20px;}
  .curr{
    font-family:'VT323',monospace; color:var(--green); font-size:46px; line-height:1;
    text-shadow: 0 0 8px rgba(61,255,138,.6), 0 0 2px rgba(61,255,138,.8);
    word-break:break-all;
  }
  .cursor{ display:inline-block; width:10px; background:var(--green); animation:blink 1s step-start infinite; margin-left:2px;}
  @keyframes blink{ 50%{ opacity:0; } }

  .pad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button{
    border:1px solid var(--line);
    background:#08120d;
    color:var(--green);
    height:56px;
    border-radius:4px;
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    transition: all .12s ease;
  }
  button:hover{ background:#0f2018; border-color:var(--green-dim); }
  button:active{ background:var(--green); color:#031008; box-shadow:0 0 16px rgba(61,255,138,.7); }
  .op{ color:var(--amber); border-color:#3a2c10; }
  .op.active{ background:var(--amber); color:#1a1100; }
  .clear{ color:#ff5c5c; border-color:#3a1414; }
  .equals{ background:var(--green); color:#031008; font-weight:700; }
  .span2{ grid-column:span 2; }

  .hint{ margin-top:14px; text-align:center; color:var(--green-dim); font-size:11px; letter-spacing:.08em; }

  .mem-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:10px; }
  .mem-row button{ height:34px; font-size:11px; }
  .mem-row .hist-btn{ color:var(--amber); border-color:#3a2c10;}
  .mem-badge{
    position:absolute; top:14px; left:14px;
    background:var(--green); color:#031008; font-size:9px; font-weight:700;
    padding:2px 7px; border-radius:3px; display:none; letter-spacing:.05em;
  }
  .mem-badge.show{ display:block; }

  .history{ margin-top:14px; max-height:0; overflow:hidden; transition:max-height .35s ease; border-top:1px dashed var(--line);}
  .history.open{ max-height:170px; overflow-y:auto; padding-top:10px; }
  .history .h-item{
    font-family:'VT323',monospace; font-size:15px; color:var(--green-dim);
    padding:3px 4px; cursor:pointer; border-radius:2px;
  }
  .history .h-item:hover{ background:rgba(61,255,138,.08); color:var(--green); }
  .history .h-empty{ text-align:center; color:var(--green-dim); font-size:12px; padding:8px 0; font-family:'JetBrains Mono',monospace;}
  .history .h-clear{
    display:block; margin:6px auto 0; background:none; border:none; color:#ff5c5c;
    font-size:10px; cursor:pointer; text-decoration:underline;
  }
</style>
</head>
<body>

<div class="machine" style="position:relative;">
  <div class="mem-badge" id="memBadge">MEM</div>
  <div class="topbar"><span><span class="led"></span>UNIT-7 ONLINE</span><span>ARITH.SYS</span></div>
  <div class="screen">
    <div class="prev" id="prev">&nbsp;</div>
    <div class="curr" id="curr">0<span class="cursor">&nbsp;</span></div>
  </div>

  <div class="mem-row">
    <button data-act="mc">MC</button>
    <button data-act="mr">MR</button>
    <button data-act="mplus">M+</button>
    <button data-act="mminus">M-</button>
    <button class="hist-btn" data-act="hist">LOG</button>
  </div>

  <div class="pad">
    <button class="clear" data-act="clear">C</button>
    <button class="clear" data-act="back">⌫</button>
    <button class="op" data-act="sign">±</button>
    <button class="op" data-op="/">/</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">*</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">-</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="span2" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="equals" data-act="equals">=</button>
  </div>

  <div class="history" id="history">
    <div class="h-empty" id="hEmpty">&gt; no log entries_</div>
    <button class="h-clear" id="hClear">clear log</button>
  </div>

  <div class="hint">&gt; keyboard input accepted_</div>
</div>

<script>
const curEl = document.getElementById('curr');
const prevEl = document.getElementById('prev');
let current = "0";
let previous = "";
let operator = null;
let justEvaluated = false;
let memory = 0;
let historyLog = [];

function updateDisplay(){
  curEl.innerHTML = current + '<span class="cursor">&nbsp;</span>';
  prevEl.textContent = previous ? `${previous} ${operator}` : '\u00A0';
  document.querySelectorAll('.op[data-op]').forEach(b=>{
    b.classList.toggle('active', b.dataset.op === operator);
  });
  document.getElementById('memBadge').classList.toggle('show', memory !== 0);
}
function inputNum(n){
  if(justEvaluated){ current = "0"; justEvaluated = false; }
  if(n === "." && current.includes(".")) return;
  current = current === "0" && n !== "." ? n : current + n;
  if(current.replace('-','').replace('.','').length > 12) return;
  updateDisplay();
}
function chooseOp(op){
  if(operator && previous !== "" && !justEvaluated){ compute(); }
  operator = op;
  previous = current;
  current = "0";
  justEvaluated = false;
  updateDisplay();
}
function compute(){
  if(operator === null || previous === "") return;
  const a = parseFloat(previous), b = parseFloat(current);
  let res;
  switch(operator){
    case '+': res = a+b; break;
    case '-': res = a-b; break;
    case '*': res = a*b; break;
    case '/': res = b===0 ? NaN : a/b; break;
  }
  const resultStr = Number.isNaN(res) ? "ERR" : String(Math.round((res + Number.EPSILON) * 1e10) / 1e10);
  if(resultStr !== "ERR"){
    historyLog.unshift(`${previous} ${operator} ${current} = ${resultStr}`);
    if(historyLog.length > 20) historyLog.pop();
    renderHistory();
  }
  current = resultStr;
  previous = ""; operator = null; justEvaluated = true;
  updateDisplay();
}
function clearAll(){ current="0"; previous=""; operator=null; justEvaluated=false; updateDisplay(); }
function backspace(){
  if(justEvaluated){ current="0"; justEvaluated=false; }
  current = current.length>1 ? current.slice(0,-1) : "0";
  updateDisplay();
}
function toggleSign(){ current = current==="0" ? "0" : String(parseFloat(current) * -1); updateDisplay(); }

function memClear(){ memory = 0; updateDisplay(); }
function memRecall(){ current = String(memory); justEvaluated=false; updateDisplay(); }
function memAdd(){ memory += parseFloat(current) || 0; updateDisplay(); }
function memSub(){ memory -= parseFloat(current) || 0; updateDisplay(); }

function renderHistory(){
  const hEmpty = document.getElementById('hEmpty');
  const panel = document.getElementById('history');
  panel.querySelectorAll('.h-item').forEach(el=>el.remove());
  if(historyLog.length === 0){ hEmpty.style.display='block'; }
  else{
    hEmpty.style.display='none';
    const items = historyLog.map(h => `<div class="h-item">&gt; ${h}</div>`).join('');
    hEmpty.insertAdjacentHTML('beforebegin', items);
  }
}
function toggleHistory(){ document.getElementById('history').classList.toggle('open'); }

document.querySelector('.pad').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.num !== undefined) inputNum(b.dataset.num);
  else if(b.dataset.op !== undefined) chooseOp(b.dataset.op);
  else if(b.dataset.act === 'equals') compute();
  else if(b.dataset.act === 'clear') clearAll();
  else if(b.dataset.act === 'back') backspace();
  else if(b.dataset.act === 'sign') toggleSign();
});
document.querySelector('.mem-row').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.act === 'mc') memClear();
  else if(b.dataset.act === 'mr') memRecall();
  else if(b.dataset.act === 'mplus') memAdd();
  else if(b.dataset.act === 'mminus') memSub();
  else if(b.dataset.act === 'hist') toggleHistory();
});
document.getElementById('history').addEventListener('click', e=>{
  if(e.target.id === 'hClear'){ historyLog = []; renderHistory(); return; }
  const item = e.target.closest('.h-item');
  if(!item) return;
  const result = item.textContent.split('=').pop().trim();
  current = result; justEvaluated = true; updateDisplay();
});

document.addEventListener('keydown', e=>{
  if(e.key >= '0' && e.key <= '9') inputNum(e.key);
  else if(e.key === '.') inputNum('.');
  else if(['+','-','*','/'].includes(e.key)) chooseOp(e.key);
  else if(e.key === 'Enter' || e.key === '=') { e.preventDefault(); compute(); }
  else if(e.key === 'Backspace') backspace();
  else if(e.key === 'Escape') clearAll();
});
updateDisplay();
renderHistory();
</script>
</body>
</html>
